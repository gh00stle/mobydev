<!-- [3.3] Linear and Block Elements -->
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Inline and Block Elements</title>
    <style>
        .inline {
                    /* Inline elements are arranged in a row, occupying only the width necessary for their content. 
                    They can contain only other inline elements or text. */
            background-color: lightgreen;
            margin: 0 5px;
            padding: 5px;
        }
        .blocky {
                    /* Block elements always start on a new line and take up the full available width. 
                    They can contain both other block elements and inline elements. */
            margin: 1px;
        }
        .inline-to-block {
            display: block;
            /* changes the display type of an element */
        }
        .block-to-inline {
            display: inline;
            /* changes the display type of an element */
        }
        div {
            display: block;
            margin: 50px;
            background-color: burlywood;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 class="blocky">BLOCK</h1>
    <strong class="inline">inline</strong>
        <!-- strong is an inline element, represents strong importance for its contents -->
    <span class="inline">spaaaaaan</span>
        <!-- span in as inline element that is useful when used with the global attributes likes 'class' -->
    <p>paraparaparagraph blocky</p>
    <div class="blocky-to-inline">its a container aaaaa</div>
    <span class="inline">inline element (span)</span>
    <img src="catphoto.jpg" class="inline-to-block">

    <div>
        <p>paragraphaaa inside a divv</p>
        <img src="cat photo.webp">
        <a href="https://en.wikipedia.org/wiki/Cat?ysclid=mugx634yi1530429537">catatattatat</a>
    </div>
</body>
