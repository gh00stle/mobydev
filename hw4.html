<!-- [1.9] Tables and Lists -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" initial-scale="1.0">
        <title>Tables and Lists</title>
    </head>


    <body>
    <h1>Tables and Lists</h1>


    <!-- Task 1: Creating lists -->
     <h3>Task 1: Creating Lists</h3>
   <ul>
       <li>Apples</li>
       <li>Bananas</li>
       <li>Pears</li>
       <li>Peaches</li>
       <li>Grapes</li>
   </ul>
   <!-- this creates an unordered list with 5 items without a specific order -->
    <ol>
       <li>Writing</li>
       <li>Final Draft</li>
       <li>Editing</li>
       <li>Publishing</li>
       <li>Selling</li>
   </ol>
   <!-- this creates an ordered list with 5 steps with a specific order -->


   <!-- Task 2: Working with tables -->
    <h3>Task 2: Working with tables</h3>
    <table border="1">
        <!-- this creates the main container for the table -->
       <tr>
        <!-- this creates a table row -->
           <th>Name</th>
           <th>Age</th>
           <th>City</th>
           <!-- this creates a table header cell -->
       </tr>
       <tr>
        <!-- this creates a table row -->
           <td>Madina</td>
           <td>34</td>
           <td>Karaganda</td>
           <!-- this creates a table data cell -->
       </tr>
       <tr>
        <!-- this creates a table row -->
           <td>Sasha</td>
           <td>23</td>
           <td>Astana</td>
           <!-- this creates a table data cell -->
       </tr>
       <tr>
        <!-- this creates a table row -->
           <td>Askar</td>
           <td>49</td>
           <td>Almaty</td>
           <!-- this creates a table data cell -->
       </tr>
   </table>
    </body>
