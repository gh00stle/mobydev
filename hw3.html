<!-- [1.8] Links and Images -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" initial-scale="1.0">
        <title>Links and Images</title>
    </head>
    <body>
        <!-- TASK 1: LINK CREATION -->
        <a href="#section1">Go to end</a>
        <!-- This anchor link scrolls to the end of the page -->
        <br>
        <a href="#section2">Go to second cat photo</a> <br> 
        <!-- This anchor link scrolls to another photo of a cat -->
         <br>
        <a href="https://en.wikipedia.org/wiki/1972" target="_blank">On this day: 1972</a>
        <!-- This redirects the user to a different page -->
        <br>
        <a href="https://en.wikipedia.org/wiki/1919" target="_blank">On this day: 1919</a>
        <!-- This redirects the user to a different page -->
        <br>
        <a href="https://en.wikipedia.org/wiki/653" target="_blank">On this day: 653</a>
        <!-- This redirects the user to a different page -->
        <br>
        <!-- TASK 2: WORKING WITH IMAGES -->
        <img src="https://t4.ftcdn.net/jpg/00/23/64/21/360_F_23642119_PIjCYMElZhLoCdMbeAo8QMqp2Ii7OIMe.jpg" alt="Photo of a large gray cat" width="706" height="999">
        <!-- this uploads the photo of a cat, & adjusts its size -->
        <h2 id="section2">Second Cat Photo</h2>
        <!-- this marks the second cat photo for the anchor link -->
        <img src="./catphoto.jpg" alt="Photo of a very long cat" width="607" height="1200">
        <!-- this uploads the photo of a cat, & adjusts its size -->
        <h2 id="section1">end</h2>
        <!-- this marks the end of the page for the anchor link -->
    </body>
</html>
